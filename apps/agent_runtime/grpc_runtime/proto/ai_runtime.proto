syntax = "proto3";

package impact.assistant.v1;

service AssistantAiService {
  rpc RunAssistant(stream AssistantStreamRequest) returns (stream AssistantStreamResponse);
}

message AssistantStreamRequest {
  oneof payload {
    AssistantRunStart run_start = 1;
    AssistantRunCancel run_cancel = 2;
  }
}

message AssistantRunStart {
  string run_id = 1;
  string user_id = 2;
  string session_id = 3;
  string agency_id = 4;
  string user_message = 5;
  string summary_memory = 6;
  string pending_task_context_json = 7;
  string recent_messages_json = 8;
  string access_json = 9;
}

message AssistantRunCancel {
  string run_id = 1;
  string reason = 2;
}

message AssistantStreamResponse {
  AssistantEvent event = 1;
}

message AssistantEvent {
  string event_type = 1;
  string message = 2;
  string payload_json = 3;
}