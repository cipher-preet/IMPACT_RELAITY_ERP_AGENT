name: Deploy to Server

on:
  push:
    branches:
      - deploy
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    name: SSH deploy
    runs-on: ubuntu-latest
    environment: development

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install sshpass
        run: sudo apt-get update && sudo apt-get install -y sshpass

      - name: Validate deploy secrets
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_PASSWORD: ${{ secrets.SSH_PASSWORD }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
        run: |
          missing=()
          for name in SSH_HOST SSH_USER SSH_PASSWORD DEPLOY_PATH; do
            if [ -z "${!name}" ]; then
              missing+=("$name")
            fi
          done
          if [ "${#missing[@]}" -gt 0 ]; then
            echo "ERROR: Missing GitHub secrets: ${missing[*]}"
            echo "Add them under Settings -> Secrets and variables -> Actions."
            exit 1
          fi
          PORT="${SSH_PORT:-22}"
          if ! [[ "$PORT" =~ ^[0-9]+$ ]]; then
            echo "ERROR: SSH_PORT must be a number (leave the secret unset to use 22)."
            exit 1
          fi

      - name: Configure SSH known hosts
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          HOST="${SSH_HOST#*@}"
          HOST="${HOST#*://}"
          HOST="${HOST%%/*}"
          PORT="${SSH_PORT:-22}"
          echo "Fetching host key for ${HOST}:${PORT}"
          if ! ssh-keyscan -T 10 -p "$PORT" -H "$HOST" >> ~/.ssh/known_hosts; then
            echo "ERROR: Could not reach ${HOST}:${PORT} from GitHub Actions."
            echo "Check SSH_HOST, SSH_PORT, server firewall, and that sshd is running."
            exit 1
          fi
          if [ ! -s ~/.ssh/known_hosts ]; then
            echo "ERROR: ssh-keyscan returned no host keys for ${HOST}:${PORT}."
            exit 1
          fi

      - name: Sync code to server
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_PASSWORD: ${{ secrets.SSH_PASSWORD }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
        run: |
          HOST="${SSH_HOST#*@}"
          HOST="${HOST#*://}"
          HOST="${HOST%%/*}"
          PORT="${SSH_PORT:-22}"
          export SSHPASS="$SSH_PASSWORD"
          sshpass -e rsync -avz --delete \
            --exclude '.git/' \
            --exclude '.github/' \
            --exclude '.env' \
            --exclude '.env.*' \
            --exclude 'venv/' \
            --exclude '.venv/' \
            --exclude 'botvenv/' \
            --exclude 'node_modules/' \
            --exclude '__pycache__/' \
            --exclude '.pytest_cache/' \
            --exclude '.mypy_cache/' \
            --exclude '.uv-cache/' \
            --exclude '.uv-python/' \
            --exclude '*.log' \
            --exclude '.DS_Store' \
            -e "ssh -p ${PORT} -o StrictHostKeyChecking=yes -o PreferredAuthentications=password -o PubkeyAuthentication=no" \
            ./ "${SSH_USER}@${HOST}:${DEPLOY_PATH}/"

      - name: Run remote deploy script
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_PASSWORD: ${{ secrets.SSH_PASSWORD }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
        run: |
          HOST="${SSH_HOST#*@}"
          HOST="${HOST#*://}"
          HOST="${HOST%%/*}"
          PORT="${SSH_PORT:-22}"
          export SSHPASS="$SSH_PASSWORD"
          sshpass -e ssh -p "$PORT" \
            -o StrictHostKeyChecking=yes \
            -o PreferredAuthentications=password \
            -o PubkeyAuthentication=no \
            "${SSH_USER}@${HOST}" \
            "cd '${DEPLOY_PATH}' && chmod +x scripts/deploy.sh && bash scripts/deploy.sh"
